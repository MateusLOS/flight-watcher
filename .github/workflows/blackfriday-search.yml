name: Black Friday Intensive Search

on:
  schedule:
    # Roda a cada 4 horas durante todo novembro (mês de Black Friday)
    - cron: '0 */4 * 11 *'
  workflow_dispatch:

jobs:
  blackfriday-search:
    name: Black Friday Search & Notify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run search + deals check
        run: python main.py
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Run RSS deals-only check (between full searches)
        run: python main.py --deals-only
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit updated price history
        run: |
          git config user.name "flight-watcher-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/price_history.json
          git diff --staged --quiet || git commit -m "chore: blackfriday history [$(date -u +'%Y-%m-%d %H:%M')]"
          git push
