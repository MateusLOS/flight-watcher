name: Setup Secrets (run once)

# Este workflow NÃO configura secrets automaticamente (isso exigiria um PAT).
# Ele valida se os secrets necessários já estão configurados e envia
# um resumo de status via Telegram.
#
# COMO ADICIONAR OS SECRETS (duas opções):
#
# OPÇÃO A — Interface web do GitHub:
#   1. Acesse: github.com/SEU_USUARIO/flight-watcher/settings/secrets/actions
#   2. Clique em "New repository secret" para cada um abaixo:
#      - TRAVELPAYOUTS_TOKEN
#      - TELEGRAM_BOT_TOKEN
#      - TELEGRAM_CHAT_ID
#
# OPÇÃO B — Terminal com gh CLI (mais rápido):
#   gh secret set TRAVELPAYOUTS_TOKEN --repo SEU_USUARIO/flight-watcher
#   gh secret set TELEGRAM_BOT_TOKEN  --repo SEU_USUARIO/flight-watcher
#   gh secret set TELEGRAM_CHAT_ID    --repo SEU_USUARIO/flight-watcher
#   (gh pedirá o valor de forma segura, sem aparecer no histórico do terminal)

on:
  workflow_dispatch:   # Rode manualmente uma vez para validar

jobs:
  validate:
    name: Validate Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Check required secrets
        run: |
          MISSING=""
          [ -z "$TRAVELPAYOUTS_TOKEN" ] && MISSING="$MISSING TRAVELPAYOUTS_TOKEN"
          [ -z "$TELEGRAM_BOT_TOKEN"  ] && MISSING="$MISSING TELEGRAM_BOT_TOKEN"
          [ -z "$TELEGRAM_CHAT_ID"    ] && MISSING="$MISSING TELEGRAM_CHAT_ID"

          if [ -n "$MISSING" ]; then
            echo "::error::Secrets ausentes:$MISSING"
            echo "Adicione-os em: github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi

          echo "✅ Todos os secrets estão configurados!"
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Send test notification via Telegram
        run: |
          RESPONSE=$(curl -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"Flight Watcher funcionando! Secrets OK. Busca diaria: 05h BRT\"}")
          echo "Resposta Telegram: $RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true' || { echo "::error::Telegram retornou erro — verifique o bot token e o chat_id"; exit 1; }
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
