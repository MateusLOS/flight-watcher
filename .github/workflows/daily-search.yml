name: Daily Flight Search

on:
  schedule:
    - cron: '0 8 * * *'    # 08:00 UTC = 05:00 BRT (manhã)
    - cron: '0 18 * * *'   # 18:00 UTC = 15:00 BRT (tarde)
    - cron: '0 4 * * *'    # 04:00 UTC = 01:00 BRT (madrugada)
  workflow_dispatch:        # Permite rodar manualmente pela interface do GitHub

jobs:
  search:
    name: Search & Notify
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Necessário para commit do histórico

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run flight search
        run: python main.py
        env:
          TRAVELPAYOUTS_TOKEN:  ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_2:   ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          SERPAPI_KEY:          ${{ secrets.SERPAPI_KEY }}

      - name: Commit updated data files
        run: |
          git config user.name "flight-watcher-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/price_history.json data/subscribers.json data/telegram_offset.json data/serpapi_state.json
          git diff --staged --quiet || git commit -m "chore: update data [$(date -u +'%Y-%m-%d')]"
          git push
